name: Slack mention scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Kick Relay Slack scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 50 -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://equity-research-ivory.vercel.app/api/slack/poll"
