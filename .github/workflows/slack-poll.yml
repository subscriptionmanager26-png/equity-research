# Backup only — GitHub may delay scheduled runs by several minutes on free tier.
# Primary poller is Upstash QStash cron (every minute).
name: Slack mention scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Kick Relay Slack scan
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 50 -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://equity-research-ivory.vercel.app/api/slack/poll?force=1"
