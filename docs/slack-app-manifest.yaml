display_information:
  name: Pocketedge
  description: Mention @Pocketedge in Slack to run a Cursor cloud agent and get answers in-thread.
  background_color: "#0f172a"
features:
  bot_user:
    display_name: Pocketedge
    always_online: true
oauth_config:
  redirect_urls:
    - https://YOUR_PUBLIC_URL/api/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - files:read
      - files:write
      - users:read
      - reactions:write
      - channels:read
      - groups:read
      - im:read
settings:
  event_subscriptions:
    request_url: https://YOUR_PUBLIC_URL/api/slack/events
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - app_uninstalled
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
